# ==============================================================================
# ChauCaoJudge LAN — Docker Compose 1-Click Setup
# ==============================================================================
# Chỉ cần chạy:
#   docker compose up -d
# Docker sẽ tự động:
#   1. Kéo image PostgreSQL 16 Alpine & pgweb Web UI
#   2. Khởi tạo Database "schooljudge", User "sj_admin", mật khẩu
#   3. Tự động chạy toàn bộ schema 17 bảng từ server/database/schema.sql
#   4. Khởi chạy Web UI xem CSDL trực quan trên http://localhost:5000
# ==============================================================================

services:
  # 1. Cơ sở dữ liệu PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: schooljudge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-schooljudge}
      POSTGRES_USER: ${PG_USER:-sj_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      # Bind vào localhost máy host để đảm bảo an toàn mạng LAN
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      # Dữ liệu bền vững lưu trên volume Docker
      - sj_postgres_data:/var/lib/postgresql/data
      # Tự động nạp schema 17 bảng ngay lần đầu khởi tạo container
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-sj_admin} -d ${PG_DATABASE:-schooljudge}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 2. Giao diện Web UI quản lý CSDL trực quan (pgweb ~30MB RAM)
  db-viewer:
    image: sosedoff/pgweb:latest
    container_name: schooljudge_pgweb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${PG_USER:-sj_admin}:${PG_PASSWORD:-postgres}@postgres:5432/${PG_DATABASE:-schooljudge}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sj_postgres_data:
    driver: local
